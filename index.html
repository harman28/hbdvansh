<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Vansh!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide.active {
    opacity: 1;
    z-index: 2;
  }
  .title-slide {
    flex-direction: column;
    position: relative;
  }
  .title-text {
    text-align: center;
  }
  .hb-big {
    color: #FFFFFF;
    font-weight: bold;
    font-size: clamp(2.2rem, 6vw, 5rem);
    letter-spacing: 0.05em;
  }
  .name-big {
    color: #F5A623;
    font-weight: bold;
    font-size: clamp(3.5rem, 10vw, 8.5rem);
    line-height: 1.1;
    margin-top: 0.2em;
  }
  .sub {
    color: #FFFFFF;
    font-style: italic;
    font-size: clamp(1.2rem, 2.5vw, 2rem);
    margin-top: 0.3em;
  }
  .bottom-icons {
    position: absolute;
    bottom: 4vh;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 3vw;
  }
  .bottom-icon {
    height: 8vh;
    width: auto;
    opacity: 0.92;
  }
  .photo-slide {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5vw;
    padding: 0 4vw;
  }
  /* the frame's own max-height/max-width bound the frame box; the photo/video
     inside is capped with the same numbers (minus padding) in vh/vw directly,
     rather than a % of the frame -- % height doesn't resolve against a parent
     that only has max-height (no explicit height), so it'd be ignored and the
     image would render at its natural, uncapped size */
  :root {
    --frame-max-h: 82vh;
    --frame-max-w: 55vw;
    --frame-pad: 1.2vh;
  }
  .photo-frame {
    background: #FFFFFF;
    padding: var(--frame-pad);
    border-radius: 1.2vh;
    box-shadow: 0 1.5vh 3vh rgba(0,0,0,0.35);
    max-height: var(--frame-max-h);
    max-width: var(--frame-max-w);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo {
    max-height: calc(var(--frame-max-h) - 2 * var(--frame-pad));
    max-width: calc(var(--frame-max-w) - 2 * var(--frame-pad));
    width: auto;
    height: auto;
    display: block;
    border-radius: 0.4vh;
    object-fit: contain;
  }
  .video-frame {
    background: #000;
    padding: var(--frame-pad);
    border-radius: 1.2vh;
    box-shadow: 0 1.5vh 3vh rgba(0,0,0,0.35);
    max-height: var(--frame-max-h);
    max-width: var(--frame-max-w);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-frame video {
    max-height: calc(var(--frame-max-h) - 2 * var(--frame-pad));
    max-width: calc(var(--frame-max-w) - 2 * var(--frame-pad));
    width: auto;
    height: auto;
    display: block;
    border-radius: 0.4vh;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 30vw;
  }
  .hb {
    font-weight: bold;
    font-size: clamp(1.8rem, 4vw, 3.2rem);
    text-align: center;
  }
  .name {
    font-weight: bold;
    font-size: clamp(2.5rem, 6vw, 5rem);
    text-align: center;
    margin-top: 0.15em;
  }
  .icons-row {
    display: flex;
    gap: 3vw;
    margin-top: 6vh;
  }
  .deco-icon {
    height: 9vh;
    width: auto;
  }

  /* ---- tiny corner control ---- */
  #ctrl-toggle {
    position: fixed;
    bottom: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.25);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    user-select: none;
    transition: background 0.2s, opacity 0.3s;
  }
  #ctrl-toggle:hover {
    background: rgba(0,0,0,0.55);
  }
  #ctrl-panel {
    position: fixed;
    bottom: 14px;
    right: 14px;
    background: rgba(20,20,20,0.85);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 13px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
    min-width: 200px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #ctrl-panel.open {
    display: flex;
  }
  #ctrl-panel .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #ctrl-panel input[type="range"] {
    flex: 1;
  }
  #ctrl-panel .val {
    min-width: 42px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #ctrl-panel .close-btn {
    align-self: flex-end;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
  #ctrl-panel .close-btn:hover {
    color: #fff;
  }

  /* ---- mobile / narrow & portrait screens ---- */
  @media (max-width: 820px) {
    .photo-slide {
      flex-direction: column;
      gap: 2vh;
      padding: 2vh 4vw;
    }
    :root {
      --frame-max-h: 58vh;
      --frame-max-w: 90vw;
    }
    .panel {
      min-width: 0;
      width: 100%;
    }
    .icons-row {
      margin-top: 2vh;
      gap: 4vw;
    }
    .deco-icon {
      height: 6vh;
    }
    .bottom-icons {
      bottom: 2vh;
      flex-wrap: wrap;
      gap: 2vw 3vw;
    }
    .bottom-icon {
      height: 5vh;
    }
    #ctrl-toggle,
    #ctrl-panel {
      bottom: max(14px, env(safe-area-inset-bottom));
      right: max(14px, env(safe-area-inset-right));
    }
    #ctrl-panel {
      min-width: 0;
      width: calc(100vw - 28px);
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <div id="ctrl-toggle" title="Slideshow settings">&#9881;</div>
  <div id="ctrl-panel">
    <button class="close-btn" id="ctrl-close">close</button>
    <div class="row">
      <label for="speed-range">Seconds per slide</label>
    </div>
    <div class="row">
      <input type="range" id="speed-range" min="2" max="20" step="1" value="5">
      <span class="val" id="speed-val">5s</span>
    </div>
  </div>

  <script>
    // ---- content data: add/remove photos or a video here ----
    const NAVY = '#1B3A5C';
    const ORANGE = '#F5A623';

    // white icons only -- they read cleanly against both the navy and orange
    // slide backgrounds (the other icon set is colored to match one background
    // and disappears against it)
    const icons = [
      'assets/icons/bottom-icon-1.png',
      'assets/icons/bottom-icon-2.png',
      'assets/icons/bottom-icon-3.png',
      'assets/icons/bottom-icon-4.png',
      'assets/icons/bottom-icon-5.png',
      'assets/icons/bottom-icon-6.png',
    ];

    // 24 birthday photos, in slideshow order
    const photos = Array.from({ length: 24 }, (_, i) => `assets/photos/photo-${i + 1}.jpg`);

    // Optional video slides, e.g. { src: 'assets/video/clip.mp4' }
    const videos = [];

    const stage = document.getElementById('stage');

    function makeTitleSlide() {
      const section = document.createElement('section');
      section.className = 'slide title-slide';
      section.style.background = NAVY;
      section.innerHTML = `
        <div class="title-text">
          <div class="hb-big">HAPPY BIRTHDAY</div>
          <div class="name-big">VANSH!</div>
          <div class="sub">Turning 3 today!</div>
        </div>
        <div class="bottom-icons">
          ${icons.map(src => `<img class="bottom-icon" src="${src}">`).join('')}
        </div>
      `;
      return section;
    }

    function makePhotoSlide(src, index) {
      const bg = index % 2 === 0 ? ORANGE : NAVY;
      const hbColor = index % 2 === 0 ? NAVY : '#FFFFFF';
      const nameColor = index % 2 === 0 ? '#FFFFFF' : ORANGE;
      const icon1 = icons[index % icons.length];
      const icon2 = icons[(index + 1) % icons.length];

      const section = document.createElement('section');
      section.className = 'slide photo-slide';
      section.style.background = bg;
      section.innerHTML = `
        <div class="photo-frame">
          <img class="photo" src="${src}">
        </div>
        <div class="panel">
          <div class="hb" style="color:${hbColor};">Happy Birthday</div>
          <div class="name" style="color:${nameColor};">Vansh!</div>
          <div class="icons-row">
            <img class="deco-icon" src="${icon1}">
            <img class="deco-icon" src="${icon2}">
          </div>
        </div>
      `;
      return section;
    }

    function makeVideoSlide(src, index) {
      const bg = index % 2 === 0 ? ORANGE : NAVY;
      const hbColor = index % 2 === 0 ? NAVY : '#FFFFFF';
      const nameColor = index % 2 === 0 ? '#FFFFFF' : ORANGE;
      const icon1 = icons[index % icons.length];
      const icon2 = icons[(index + 1) % icons.length];

      const section = document.createElement('section');
      section.className = 'slide photo-slide';
      section.style.background = bg;
      section.innerHTML = `
        <div class="video-frame">
          <video src="${src}" autoplay muted loop playsinline></video>
        </div>
        <div class="panel">
          <div class="hb" style="color:${hbColor};">Happy Birthday</div>
          <div class="name" style="color:${nameColor};">Vansh!</div>
          <div class="icons-row">
            <img class="deco-icon" src="${icon1}">
            <img class="deco-icon" src="${icon2}">
          </div>
        </div>
      `;
      return section;
    }

    stage.appendChild(makeTitleSlide());
    photos.forEach((src, i) => stage.appendChild(makePhotoSlide(src, i)));
    videos.forEach((v, i) => stage.appendChild(makeVideoSlide(v.src, photos.length + i)));

    const slides = document.querySelectorAll('.slide');
    let current = 0;
    slides[0].classList.add('active');

    let intervalMs = 5000;
    let timer = null;

    function nextSlide() {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }

    function startTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(nextSlide, intervalMs);
    }
    startTimer();

    // ---- corner control wiring ----
    const toggleBtn = document.getElementById('ctrl-toggle');
    const panel = document.getElementById('ctrl-panel');
    const closeBtn = document.getElementById('ctrl-close');
    const range = document.getElementById('speed-range');
    const valLabel = document.getElementById('speed-val');

    toggleBtn.addEventListener('click', () => {
      panel.classList.toggle('open');
    });
    closeBtn.addEventListener('click', () => {
      panel.classList.remove('open');
    });
    range.addEventListener('input', () => {
      const seconds = parseInt(range.value, 10);
      valLabel.textContent = seconds + 's';
      intervalMs = seconds * 1000;
      startTimer(); // restart with new duration from now
    });
  </script>
</body>
</html>
